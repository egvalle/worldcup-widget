name: Actualizar Mundial

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

jobs:

  update:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/update.js

      - name: Commit cambios

        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data/matches.json

          git diff --staged --quiet || git commit -m "Actualizar resultados"

          git push
